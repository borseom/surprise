<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>श्री, एक प्रश्न</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Noto+Serif+Devanagari:wght@600&family=DM+Sans:wght@500&display=swap">
<style>
:root{--bg:#2b1230;--ink:#fff1ec;--rose:#ff5d8f;--gold:#ffc46b;--muted:#d9b9c9;--btn:#3e1a45;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b1230}}
:root[data-theme="dark"]{--bg:#2b1230}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 25%,#52205b 0%,var(--bg) 70%);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;overflow:hidden;text-align:center}
main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:22px}
h1{font-family:"Fraunces","Noto Serif Devanagari",Georgia,serif;font-weight:600;font-size:clamp(1.9rem,7vw,3.4rem);line-height:1.25;margin:0;max-width:18ch}
p{margin:0;color:var(--muted);font-size:1.05rem;max-width:34ch;line-height:1.5;min-height:1.5em}
#face{font-size:5.5rem;line-height:1;transition:transform .3s;filter:drop-shadow(0 8px 20px rgba(255,93,143,.4))}
#face.pop{transform:scale(1.25) rotate(-8deg)}
.row{display:flex;gap:22px;align-items:center;justify-content:center;min-height:90px}
button{font:inherit;font-size:1.15rem;border:0;border-radius:999px;padding:14px 34px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#yes{background:var(--rose);color:#fff;box-shadow:0 8px 28px rgba(255,93,143,.5);transition:transform .25s;transform:scale(var(--s,1));animation:beat 1.6s ease-in-out infinite}
@keyframes beat{50%{box-shadow:0 8px 40px rgba(255,93,143,.9)}}
#no{background:var(--btn);color:var(--ink);border:1px solid #6b3a73;transition:left .28s ease,top .28s ease;white-space:nowrap;z-index:5}
#no.free{position:fixed}
#answer{display:none;flex-direction:column;gap:16px;align-items:center}
#answer.show{display:flex}
#bigheart{font-size:5rem;animation:thump 1s ease-in-out infinite}
@keyframes thump{50%{transform:scale(1.2)}}
#bg{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-40px;opacity:.35;animation:fall var(--d) linear infinite;animation-delay:var(--w)}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(360deg)}}
.heart{position:fixed;bottom:-40px;font-size:28px;pointer-events:none;z-index:9;animation:rise var(--d) ease-out forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(var(--r));opacity:.2}}
#bar{width:min(260px,70vw);height:8px;border-radius:99px;background:#4a2453;overflow:hidden}
#fill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width 2.2s ease}
#lines{display:flex;flex-direction:column;gap:14px;align-items:center;max-width:32ch}
#lines p{color:var(--ink);font-size:1.1rem;opacity:0;transform:translateY(8px);transition:opacity .8s,transform .8s}
#lines p.on{opacity:1;transform:none}
#lines p:last-child{font-family:"Fraunces",Georgia,serif;font-size:1.4rem;color:var(--gold)}
#answer.show{max-height:100%;overflow-y:auto;padding:12px 0}
#tell{display:inline-block;margin-top:6px;background:var(--rose);color:#fff;text-decoration:none;border-radius:999px;padding:12px 28px;font-size:1.1rem}
@media (prefers-reduced-motion:reduce){.heart,.petal{display:none}#no{transition:none}#yes,#bigheart{animation:none}}
</style>
</head>
<body>
<div id="bg"></div>
<main>
  <section id="ask">
    <div id="face">🥺</div>
    <h1 id="q"></h1>
  </section>
  <p id="hint"></p>
  <div class="row" id="row">
    <button id="yes">Yes 💖</button>
    <button id="no">No</button>
  </div>
  <section id="answer" aria-live="polite">
    <div id="bigheart">💖</div>
    <h1 id="a"></h1>
    <div id="bar"><i id="fill"></i></div><p id="load"></p><div id="lines"></div>
  </section>
</main>
<script>
// ✏️ Edit these lines to personalise
var HER_NAME = "श्री";
var HIS_NAME = "Om";
var QUESTION = HER_NAME + ", will you be mine?";
var REPLY = HER_NAME + " 💗 Thanks for your yes 💗";
// Optional: your WhatsApp number with country code, digits only (e.g. "91XXXXXXXXXX").
// If set, a "Tell Om" button appears after she says yes and opens a ready message to you.
var WHATSAPP = "917517952378";
var LINES = [
  "I hope saying yes also makes you smile and fills you with butterflies 🦋",
  "No one admires you the way I do.",
  "You always make my face smile and my eyes shine ✨",
  "I will always adore you and never hurt you. I will never make your eyes full of tears.",
  "I will maintain the \u201cghar ki choti beti\u201d standards.",
  "No one else can ever take your place in my heart, for the rest of my life.",
  "I know you are the one for me, but I will try to become the one you want.",
  "Forever yours, " + HIS_NAME + " 💖"
];

var faces = ["🥺","🥺","😢","😢","😭","😭","🥹","💔"];
var hints = ["","Oops, missed!","Are you sure?","Wrong button 😉","Try the pink one…","Pretty please? 🥺","The No button is shy","Just say yes, " + HER_NAME];
var labels = ["No","No?","Nope","Hmm no","Still no","No :(","No…","No!!"];

var $ = function(id){return document.getElementById(id)};
var yes=$("yes"), no=$("no"), face=$("face"), hint=$("hint");
$("q").textContent = QUESTION;
var done=false, count=0;

// soft falling petals in the background
var bg=$("bg"), pets=["🌸","💗","✨","🌷"];
for(var i=0;i<14;i++){
  var p=document.createElement("span");
  p.className="petal"; p.textContent=pets[i%4];
  p.style.left=(Math.random()*100)+"vw";
  p.style.fontSize=(14+Math.random()*16)+"px";
  p.style.setProperty("--d",(12+Math.random()*10)+"s");
  p.style.setProperty("--w",(-Math.random()*20)+"s");
  p.style.setProperty("--x",(Math.random()*120-60)+"px");
  bg.appendChild(p);
}

function dodge(e){
  if(done) return;
  if(e){e.preventDefault();e.stopPropagation();}
  count++;
  var k=Math.min(count,faces.length-1);
  face.textContent=faces[k];
  face.classList.add("pop"); setTimeout(function(){face.classList.remove("pop")},250);
  hint.textContent=hints[Math.min(count,hints.length-1)];
  no.textContent=labels[Math.min(count,labels.length-1)];
  yes.style.setProperty("--s",Math.min(1+count*0.12,2.2)); // Yes keeps growing

  var w=no.offsetWidth,h=no.offsetHeight,pad=12;
  var maxX=window.innerWidth-w-pad,maxY=window.innerHeight-h-pad;
  var yr=yes.getBoundingClientRect(),x,y,t=0;
  do{
    x=pad+Math.random()*Math.max(0,maxX-pad);
    y=pad+Math.random()*Math.max(0,maxY-pad);
    t++;
  }while(t<30&&x<yr.right+30&&x+w>yr.left-30&&y<yr.bottom+30&&y+h>yr.top-30);
  no.classList.add("free");
  no.style.left=x+"px"; no.style.top=y+"px";
}
["mouseover","pointerdown","touchstart","click","focus"].forEach(function(ev){
  no.addEventListener(ev,dodge,{passive:false});
});

function hearts(){
  var set=["💖","💗","💕","💘","🌹","✨","🌸"];
  for(var i=0;i<60;i++){
    var s=document.createElement("span");
    s.className="heart"; s.textContent=set[i%set.length];
    s.style.left=Math.random()*100+"vw";
    s.style.setProperty("--d",(3+Math.random()*3)+"s");
    s.style.setProperty("--r",(Math.random()*80-40)+"deg");
    s.style.animationDelay=(Math.random()*1.5)+"s";
    document.body.appendChild(s);
    setTimeout(function(el){el.remove()},9000,s);
  }
}

function type(el,text,i){
  var c=Array.from(text);
  if(i>c.length) return;
  el.textContent=c.slice(0,i).join("");
  setTimeout(function(){type(el,text,i+1)},45);
}

yes.addEventListener("click",function(){
  if(done) return;            // Yes works only once
  done=true; yes.disabled=true;
  $("row").style.display="none"; no.style.display="none";
  $("ask").style.display="none"; hint.style.display="none";
  $("answer").classList.add("show");
  hearts();
  type($("a"),REPLY,0);
  var load=$("load"); load.textContent="Loading our happy moment…";
  setTimeout(function(){$("fill").style.width="100%"},100);
  setTimeout(function(){
    load.textContent="100% loaded 💗"; $("bar").style.display="none";
    var box=$("lines");
    LINES.forEach(function(t,i){
      var p=document.createElement("p"); p.textContent=t; box.appendChild(p);
      setTimeout(function(){p.classList.add("on"); p.scrollIntoView({behavior:"smooth",block:"nearest"});},600+i*2000);
    });
    if(WHATSAPP){
      setTimeout(function(){
        var a=document.createElement("a");
        a.id="tell"; a.target="_blank"; a.rel="noopener";
        a.href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent("Yes! 💗 — "+HER_NAME);
        a.textContent="Tell "+HIS_NAME+" 💌";
        box.appendChild(a);
        a.scrollIntoView({behavior:"smooth",block:"nearest"});
      },600+LINES.length*2000);
    }
  },2600);
});
</script>
</body>
</html>
